[versions]
agp = "9.1.1"
asm = "9.10.1"
commons-io = "2.22.0"
compile-testing = "0.23.0"
graal = "25.2.4"
javapoet = "0.20.0"
jnigen-commons = "3.1.2"
androidx-annotation = "1.11.0"
junit = "6.1.3"
ktlint = "1.8.0"
semver4j = "6.0.0"
shadow = "9.6.1"
spotless = "8.10.2"

[libraries]
android-gradle = { module = "com.android.tools.build:gradle", version.ref = "agp" }
android-gradle-api = { module = "com.android.tools.build:gradle-api", version.ref = "agp" }
asm = { module = "org.ow2.asm:asm", version.ref = "asm" }
asm-commons = { module = "org.ow2.asm:asm-commons", version.ref = "asm" }
commons-io = { module = "commons-io:commons-io", version.ref = "commons-io" }
compile-testing = { module = "com.google.testing.compile:compile-testing", version.ref = "compile-testing" }
javapoet = { module = "com.palantir.javapoet:javapoet", version.ref = "javapoet" }
jnigen-commons = { module = "com.badlogicgames.jnigen:jnigen-commons", version.ref = "jnigen-commons" }
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "androidx-annotation" }
spotless-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
semver4j = { module = "org.semver4j:semver4j", version.ref = "semver4j" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
